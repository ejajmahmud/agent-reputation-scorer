[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reputation-scorer"
version = "0.1.0"
description = "Dynamic Bayesian reputation and trust scoring engine for multi-agent peers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-reputation-scorer = "agent_reputation_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_reputation_scorer*"]
